<style>
:root{
  --c-primary:#1e3a8a; --c-primary-2:#2d4fb3; --c-bg:#f3f5fa; --c-text:#1f2937; --c-muted:#6b7280; --c-border:#e5e7eb;
  --sb-w:272px; --topbar-h:60px; --radius:14px; --tap:44px;
  --bs-primary:#1e3a8a; --bs-primary-rgb:30,58,138; --bs-link-color:#1e3a8a; --bs-link-hover-color:#14275f;
  --bs-body-font-family:'Noto Sans Thai','Prompt','Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--bs-body-font-family);background:var(--c-bg);color:var(--c-text);font-size:.95rem}
.doc-font,.doc-font *{font-family:'Noto Sans Thai','Sarabun','Prompt',sans-serif}
.btn-primary{--bs-btn-bg:#1e3a8a;--bs-btn-border-color:#1e3a8a;--bs-btn-hover-bg:#17306f;--bs-btn-hover-border-color:#17306f;--bs-btn-active-bg:#14275f;--bs-btn-active-border-color:#14275f;--bs-btn-disabled-bg:#1e3a8a;--bs-btn-disabled-border-color:#1e3a8a}
.btn-outline-primary{--bs-btn-color:#1e3a8a;--bs-btn-border-color:#1e3a8a;--bs-btn-hover-bg:#1e3a8a;--bs-btn-hover-border-color:#1e3a8a;--bs-btn-active-bg:#1e3a8a;--bs-btn-active-border-color:#1e3a8a}
.text-primary{color:#1e3a8a!important}
.nav-tabs .nav-link{color:var(--c-muted)}
.nav-tabs .nav-link.active{color:var(--c-primary);font-weight:600}

/* ---------- Touch targets ---------- */
.btn,.form-control,.form-select,.input-group-text{min-height:var(--tap)}
.btn-sm{min-height:36px}
.form-check-input{width:1.25em;height:1.25em;margin-top:.2em}
.form-check-input[type=checkbox].form-switch,.form-switch .form-check-input{width:2.4em;height:1.3em}
.dropdown-item{padding:.7rem 1rem}
.btn-icon{width:var(--tap);padding:0;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;font-size:1.15rem;color:var(--c-text)}
.btn-icon:hover{background:#eef1f8}

/* ---------- Loading ---------- */
.loading-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.loading-overlay.d-none{display:none!important}
.loading-box{background:#fff;padding:1.75rem 2.25rem;border-radius:var(--radius);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);max-width:90vw}
.swal2-container{z-index:2100!important}
.swal2-popup{font-family:var(--bs-body-font-family)!important}

/* ---------- Login ---------- */
body.is-login{background:#0f1f4d}
.login-wrap{min-height:100vh;min-height:100dvh;display:flex}
.login-hero{flex:1 1 55%;background:linear-gradient(135deg,#1e3a8a 0%,#3b5bdb 55%,#5f7df0 100%);color:#fff;align-items:center;justify-content:center;padding:3rem;position:relative;overflow:hidden}
.login-hero::before,.login-hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.login-hero::before{width:420px;height:420px;right:-120px;top:-120px}
.login-hero::after{width:300px;height:300px;left:-80px;bottom:-100px}
.login-hero-inner{max-width:520px;position:relative;z-index:1}
.login-logo{width:76px;height:76px;border-radius:20px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin-bottom:1.25rem}
.login-logo.sm{width:60px;height:60px;font-size:1.7rem;background:var(--c-primary);color:#fff;margin-bottom:0}
.login-features li{padding:.5rem 0;font-size:1.05rem}
.login-features i{width:2rem;opacity:.9}
.login-panel{flex:1 1 45%;background:var(--c-bg);display:flex;align-items:center;justify-content:center;padding:1.5rem}
.login-card{background:#fff;width:100%;max-width:430px;padding:2rem 1.75rem;border-radius:20px;box-shadow:0 15px 45px rgba(15,23,42,.15)}
@media(max-width:991.98px){.login-panel{background:linear-gradient(160deg,#1e3a8a,#3b5bdb)}}

/* ---------- Layout ---------- */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);background:linear-gradient(180deg,#14275f 0%,#1e3a8a 100%);color:#e8edff;display:flex;flex-direction:column;z-index:1040;transition:transform .25s ease;height:100vh;height:100dvh}
.sb-brand{display:flex;align-items:center;gap:.75rem;padding:1rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.12);min-height:var(--topbar-h)}
.sb-logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none}
.sb-brand-text{min-width:0;line-height:1.2}
.sb-brand-text strong{display:block;font-size:1.1rem}
.sb-brand-text small{display:block;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-close{margin-left:auto;color:#fff;border:0}
.sb-nav{flex:1;overflow-y:auto;padding:.75rem .6rem;-webkit-overflow-scrolling:touch}
.sb-title{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;opacity:.55;padding:.9rem .75rem .3rem}
.sb-link{display:flex;align-items:center;gap:.75rem;padding:.7rem .85rem;min-height:var(--tap);border-radius:10px;color:#dbe4ff;text-decoration:none;margin-bottom:2px;transition:background .15s}
.sb-link i{width:1.3rem;text-align:center;opacity:.9}
.sb-link span:not(.sb-badge){flex:1}
.sb-link:hover{background:rgba(255,255,255,.1);color:#fff}
.sb-link.active{background:#fff;color:var(--c-primary);font-weight:600}
.sb-badge{background:#ef4444;color:#fff;border-radius:999px;font-size:.72rem;padding:.1rem .5rem;min-width:1.5rem;text-align:center}
.sb-foot{padding:.9rem 1rem;border-top:1px solid rgba(255,255,255,.12)}
.sb-user{display:flex;align-items:center;gap:.7rem}
.sb-user-text{min-width:0}
.sb-user-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user small{opacity:.7}
.avatar{width:40px;height:40px;border-radius:50%;background:#e0e7ff;color:var(--c-primary);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.avatar.sm{width:32px;height:32px;font-size:.85rem}

.main{margin-left:var(--sb-w);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;transition:margin-left .25s ease;min-width:0}
body.sb-collapsed .sidebar{transform:translateX(-100%)}
body.sb-collapsed .main{margin-left:0}
.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1035}
.topbar{position:sticky;top:0;z-index:1020;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:.5rem;padding:0 1rem}
.topbar-title{font-size:1.15rem;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-btn{display:flex;align-items:center;gap:.5rem;border:0;background:transparent}
.user-btn:hover,.user-btn.show{background:#eef1f8}
.content{padding:1.25rem;flex:1;min-width:0}
.app-foot{padding:.9rem 1.25rem;text-align:center;color:var(--c-muted);font-size:.8rem}

@media(max-width:991.98px){
  .sidebar{transform:translateX(-100%);box-shadow:none;width:min(300px,86vw)}
  .main{margin-left:0}
  body.sb-open .sidebar{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  body.sb-open .sb-backdrop{display:block}
  body.sb-open{overflow:hidden}
  .content{padding:.9rem}
}

/* ---------- Page ---------- */
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:1rem}
.page-title{font-size:1.3rem;font-weight:600;margin:0}
.card{border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:0 1px 3px rgba(15,23,42,.04)}
.card-header{background:#fff;border-bottom:1px solid var(--c-border);font-weight:600;padding:.85rem 1.1rem;border-radius:var(--radius) var(--radius) 0 0!important}
.empty-state{padding:2rem 1rem;text-align:center;color:var(--c-muted)}
.page.fade-in{animation:pageIn .2s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Stat cards ---------- */
.stat-card{display:flex;align-items:center;gap:.9rem;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:1rem;cursor:pointer;height:100%;transition:transform .15s,box-shadow .15s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.08)}
.stat-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex:none}
.stat-num{font-size:1.9rem;font-weight:700;line-height:1}
.stat-label{color:var(--c-muted);font-size:.85rem;margin-top:.25rem}
.c-blue .stat-icon{background:#e0e9ff;color:#1e3a8a}
.c-amber .stat-icon{background:#fef3c7;color:#b45309}
.c-green .stat-icon{background:#d1fae5;color:#047857}
.c-red .stat-icon{background:#fee2e2;color:#b91c1c}
.chart-box{position:relative;height:320px}
@media(max-width:575.98px){.chart-box{height:260px}.stat-num{font-size:1.5rem}.stat-icon{width:44px;height:44px;font-size:1.15rem}}

/* ---------- Chips / badges ---------- */
.chip{display:inline-block;padding:.2rem .65rem;border-radius:999px;font-size:.78rem;font-weight:500;white-space:nowrap}
.chip-gray{background:#e5e7eb;color:#374151}
.chip-blue{background:#dbeafe;color:#1d4ed8}
.chip-green{background:#d1fae5;color:#047857}
.chip-amber{background:#fef3c7;color:#b45309}
.chip-orange{background:#ffedd5;color:#c2410c}
.chip-red{background:#fee2e2;color:#b91c1c}
.chip-purple{background:#ede9fe;color:#6d28d9}

/* ---------- Tables / DataTables ---------- */
.table-responsive{-webkit-overflow-scrolling:touch}
.tbl{min-width:720px}
.tbl thead th{background:#f8fafc;font-weight:600;white-space:nowrap;border-bottom:2px solid var(--c-border)}
.tbl td{vertical-align:middle}
.tbl td.wrap{min-width:220px;white-space:normal}
.tbl .btn{margin-left:.15rem}
.btn-tbl{min-width:var(--tap);min-height:38px}
.dt-container .dt-search input,.dt-container .dt-length select{min-height:38px}
.dt-container .dt-paging .page-link{min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center}
.dt-container .row{--bs-gutter-y:.5rem}
tr.row-overdue>td:first-child,tr.row-near>td:first-child,tr.row-normal>td:first-child,tr.row-done>td:first-child{box-shadow:inset 5px 0 0 transparent}
tr.row-normal>td:first-child{box-shadow:inset 5px 0 0 #10b981}
tr.row-near>td:first-child{box-shadow:inset 5px 0 0 #f59e0b}
tr.row-overdue>td:first-child{box-shadow:inset 5px 0 0 #ef4444}
tr.row-done>td:first-child{box-shadow:inset 5px 0 0 #9ca3af}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;font-size:.85rem;color:var(--c-muted)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:.35rem}
.dot-ok{background:#10b981}.dot-near{background:#f59e0b}.dot-over{background:#ef4444}.dot-done{background:#9ca3af}
.urgent-item{display:block;padding:.8rem 1rem;text-decoration:none;color:inherit;border-bottom:1px solid var(--c-border)}
.urgent-item:last-child{border-bottom:0}
.urgent-item:hover{background:#f8fafc}
.urgent-subject{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}

/* ---------- Forms / pickers ---------- */
.chip-wrap{display:flex;flex-wrap:wrap;gap:.4rem}
.chip-btn{border:1px solid #c7d2fe;background:#eef2ff;color:var(--c-primary);border-radius:999px;padding:.4rem .85rem;font-size:.85rem;min-height:38px;cursor:pointer;text-align:left}
.chip-btn:hover,.chip-btn:focus-visible{background:#dbe4ff}
.pick-list{max-height:260px;overflow-y:auto;border:1px solid var(--c-border);border-radius:10px;background:#fff;-webkit-overflow-scrolling:touch}
.pick-group{position:sticky;top:0;background:#f1f5f9;padding:.4rem .8rem;font-size:.8rem;font-weight:600;color:#475569;display:flex;justify-content:space-between;align-items:center;z-index:1}
.pick-group button{border:0;background:transparent;color:var(--c-primary);font-size:.8rem;padding:.2rem .4rem}
.pick-item{display:flex;align-items:center;gap:.7rem;padding:.55rem .8rem;min-height:var(--tap);cursor:pointer;border-bottom:1px solid #f1f5f9;margin:0}
.pick-item:hover{background:#f8fafc}
.pick-item input{flex:none}
.pick-item small{color:var(--c-muted);display:block;line-height:1.2}
.pick-item.hidden,.pick-group.hidden{display:none}

.corner-picker{position:relative;width:120px;height:160px;border:2px solid #cbd5e1;border-radius:8px;background:#fff;flex:none}
.cp-page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e2e8f0;font-size:2.6rem;pointer-events:none}
.cp{position:absolute;margin:0;z-index:1}
.cp.tl{top:5px;left:5px}.cp.tr{top:5px;right:5px}.cp.bl{bottom:5px;left:5px}.cp.br{bottom:5px;right:5px}
.cp input{position:absolute;opacity:0;pointer-events:none}
.cp span{width:44px;height:44px;border:1px dashed #94a3b8;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#94a3b8;cursor:pointer;background:#fff}
.cp input:checked+span{background:var(--c-primary);border:1px solid var(--c-primary);color:#fff}
.cp input:focus-visible+span{outline:3px solid #93a8f5}

.step-list{list-style:none;padding:0;margin:0;counter-reset:s}
.step-list li{counter-increment:s;display:flex;align-items:center;gap:.7rem;padding:.55rem 0;color:var(--c-muted)}
.step-list li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:#e5e7eb;color:#374151;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:600;flex:none}
.step-list li.active{color:var(--c-text);font-weight:500}
.step-list li.active::before{content:"";background:#fff;border:3px solid #cbd5e1;border-top-color:var(--c-primary);animation:spin .8s linear infinite}
.step-list li.done{color:#047857}
.step-list li.done::before{content:"\2713";background:#10b981;color:#fff}
.step-list li.error{color:#b91c1c}
.step-list li.error::before{content:"!";background:#ef4444;color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

.pdf-frame{width:100%;height:68vh;min-height:420px;border:0;background:#525659;display:block}
#modalPdf .pdf-frame{height:78vh}
.sig-preview{display:inline-flex;align-items:center;justify-content:center;min-width:220px;min-height:110px;padding:.5rem;border:2px dashed #cbd5e1;border-radius:10px;
  background:repeating-conic-gradient(#f1f5f9 0% 25%,#fff 0% 50%) 50%/16px 16px}
.sig-preview img{max-width:100%;max-height:120px}

/* ---------- Timeline ---------- */
.timeline{list-style:none;margin:0;padding:0 0 0 1.25rem;position:relative}
.timeline::before{content:"";position:absolute;left:.4rem;top:.4rem;bottom:.4rem;width:2px;background:#dbe4ff}
.timeline li{position:relative;padding:0 0 1rem 1rem}
.timeline li::before{content:"";position:absolute;left:-1.1rem;top:.35rem;width:12px;height:12px;border-radius:50%;background:var(--c-primary);border:2px solid #fff;box-shadow:0 0 0 2px #dbe4ff}
.timeline li.tl-green::before{background:#10b981}
.timeline li.tl-amber::before{background:#f59e0b}
.timeline li.tl-gray::before{background:#9ca3af}
.timeline .tl-time{font-size:.78rem;color:var(--c-muted)}
.timeline .tl-title{font-weight:600}
.timeline .tl-detail{font-size:.88rem;color:#4b5563;word-break:break-word}

/* ---------- Reports / Print ---------- */
.print-area{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:1.25rem}
.print-head{margin-bottom:1rem}
.print-org{font-size:1.05rem;font-weight:600}
.print-title{font-size:1.3rem;font-weight:700}
.print-period{color:var(--c-muted)}
.report-table{font-size:.9rem;min-width:900px}
.report-table th{background:#f1f5f9;text-align:center;vertical-align:middle}
.report-table td{vertical-align:top}
.print-foot{margin-top:.75rem}

@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{background:#fff!important;font-size:11pt}
  .sidebar,.topbar,.no-print,.app-foot,.sb-backdrop,.modal,.loading-overlay,.swal2-container{display:none!important}
  .main{margin:0!important}
  .content{padding:0!important}
  .page{display:none!important}
  .page.print-target{display:block!important}
  .print-area{border:0;padding:0;border-radius:0}
  .table-responsive{overflow:visible!important}
  .report-table{min-width:0;width:100%;font-size:10pt}
  .report-table th,.report-table td{border:1px solid #000!important;padding:3px 5px!important}
  .report-table thead{display:table-header-group}
  .report-table tr{page-break-inside:avoid}
  .dt-container .dt-search,.dt-container .dt-paging,.dt-container .dt-length,.dt-container .dt-info{display:none!important}
}
</style>
